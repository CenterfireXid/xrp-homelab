services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    init: true
    environment:
      TZ: America/Denver
      PORT: "5055"
    ports:
      - "5055:5055"
    volumes:
      - /srv/docker/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
